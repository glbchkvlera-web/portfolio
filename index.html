опроса «нравится ли вам дизайн».\",\n  \"Психология полезна: люди говорят вежливо, а поведение честнее.\",\n  \"Верю наблюдению больше, чем «и так всё понятно».\"\n];\n\nconst HYPS = [\n  { block: \"Начало работы\", checked: \"Инспектор впервые открывает веб-версию сервиса: нужно понять, с чего начать, и найти инструкцию\",\n    bad: false, verdict: \"Барьеров нет: все начали работу сами. Гипотеза не подтвердилась — доработку сняли из бэклога.\" },\n  { block: \"Создание мероприятия\", checked: \"Инспектор заполняет карточку проверки: дату, время, данные организации — и запускает мероприятие\",\n    bad: true, verdict: \"Барьеры подтверждены, критично: поля даты и времени спрятаны внутри чужого блока, инспекторы их не находят.\" },\n  { block: \"Исправление ошибки\", checked: \"Инспектор заметил опечатку в уже созданной проверке и пытается её исправить\",\n    bad: true, verdict: \"Барьер подтверждён, критично: редактирования нет, проверку приходится создавать заново.\" },\n  { block: \"Место проверки на карте\", checked: \"Инспектор указывает, где физически находится проверяемый объект\",\n    bad: true, verdict: \"Барьер подтверждён: адрес ввести некуда, нужны координаты — инспекторы ищут их в сторонних картах.\" },\n  { block: \"Видеосвязь с организацией\", checked: \"Инспектор приглашает организацию на видеовстречу и ведёт осмотр: камера, демонстрация экрана\",\n    bad: false, verdict: \"Барьеров нет: видеовстреча прошла спокойно у всех. Ещё одна гипотеза не подтвердилась.\" },\n  { block: \"Завершение проверки\", checked: \"Инспектор закрывает мероприятие и получает материалы записи для отчёта\",\n    bad: true, verdict: \"Барьеры подтверждены, критично: две разные кнопки «Завершить», закрытие необратимо и без подтверждения.\" }\n];\n\nconst STEPS = [\n  { num: \"1\", cause: \"не нашёл\", ok: false, title: \"Создание мероприятия\", text: \"Поля даты и времени скрыты за кнопкой в блоке проверяемой организации. Действия наугад, запрос подсказки, ошибка системы.\" },\n  { num: \"2\", cause: \"ушёл из сервиса\", ok: false, title: \"Объект на карте\", text: \"Нужны координаты: инспектор сворачивает сервис, ищет объект в сторонних картах, переносит широту и долготу вручную.\" },\n  { num: \"3\", cause: \"барьеров нет\", ok: true, title: \"Приглашение и видеосвязь\", text: \"Видеовстреча проходила без затруднений: гипотезы про камеру, демонстрацию экрана и прокрутку не подтвердились.\" },\n  { num: \"4\", cause: \"избегал действия\", ok: false, title: \"Завершение мероприятия\", text: \"Две кнопки «Завершить» и красная иконка без подписи. Необратимое действие без подтверждения — либо ошибочное нажатие, либо отказ нажимать.\" },\n  { num: \"5\", cause: \"система не позволила\", ok: false, title: \"Правка данных и материалы\", text: \"Карточка не редактируется, материалы видеовстречи формируются долго. Ошибку можно исправить только пересозданием записи.\" }\n];\n\nconst FINDINGS = [\n  {\n    sev: \"КРИТИЧНАЯ\", crit: true, meta: \"подтверждена у 5 из 6 · система не позволила\",\n    title: \"Инспектору недоступно редактирование созданной карточки мероприятия\",\n    fact: \"Внести изменения в уже созданное мероприятие нельзя. При обнаружении ошибки запись нужно пересоздавать целиком.\",\n    interp: \"Цена опечатки — повторный контакт с проверяемой организацией и новая заявка. Инспектор перестаёт доверять собственным действиям и перепроверяет каждое поле.\",\n    rec: \"Реализовать редактирование в карточке мероприятия, точка входа — иконка «Карандаш» в карточке.\"\n  },\n  {\n    sev: \"КРИТИЧНАЯ\", crit: true, meta: \"вне гипотез · не нашёл\",\n    title: \"Неочевидно, где указать дату и время: поля скрыты за кнопкой в чужом блоке\",\n    fact: \"Поля появляются только после нажатия «Добавить» в блоке данных проверяемой организации. Респонденты действовали наугад, просили подсказку или сразу нажимали «Создать мероприятие» и получали ошибку.\",\n    interp: \"Обязательный шаг спрятан за необязательным на вид действием. Отсюда дезориентация, высокая когнитивная нагрузка и риск прервать путь на первом же экране.\",\n    rec: \"Вынести выбор даты и времени отдельным видимым блоком экрана «Новое мероприятие», без скрытия за кнопкой.\"\n  },\n  {\n    sev: \"ВЫСОКАЯ\", crit: false, meta: \"гипотеза подтверждена · система не позволила\",\n    title: \"Адрес объекта вводить негде — местоположение приходится искать по координатам\",\n    fact: \"Чтобы указать объект, нужно ввести широту и долготу или вручную масштабировать карту. Инспекторы уходили в сторонние карты, копировали координаты, сопоставляли точку на глаз — вплоть до промаха на километр и пересоздания карточки.\",\n    interp: \"Сервис требует данные в машинном формате, а инспектор работает с адресами. Переключение между программами рвёт фокус и делает точность непредсказуемой.\",\n    rec: \"Адресная строка (город, улица, дом), интеграция с государственным адресным реестром, автозаполнение координат.\"\n  },\n  {\n    sev: \"КРИТИЧНАЯ\", crit: true, meta: \"вне гипотез · избегал действия / не понял\",\n    title: \"Непонятно, какая из двух кнопок «Завершить» закрывает мероприятие навсегда\",\n    fact: \"Кнопка «Завершить» есть и на экране видеосвязи, и в карточке мероприятия, плюс красная иконка без подписи. Обе кнопки закрывают мероприятие окончательно — даже до его фактического начала.\",\n    interp: \"Инспекторы либо ошибочно закрывали непроведённые мероприятия, либо избегали нажатия вовсе. Необратимое действие без подтверждения — источник стресса, а не только ошибок.\",\n    rec: \"Тултип «Завершить видеосвязь» у красной иконки, переименовать кнопку в «Завершить мероприятие», добавить диалог подтверждения перед необратимым закрытием.\"\n  }\n];\n\nconst STAGES = [\n  { num: \"1\", short: \"Планирование поездки\", crit: false, e: 0.92,\n    does: \"Билет, маршрут, брони\", barrier: \"Барьеров нет\", quote: \"\", tobe: \"—\" },\n  { num: \"2\", short: \"Обнаружение проблемы\", crit: false, e: 0.52,\n    does: \"Табло, объявления, приложение\", barrier: \"Ни причины, ни срока\",\n    quote: \"«Никто толком не объяснял, что происходит»\", tobe: \"Проактивное уведомление\" },\n  { num: \"3\", short: \"Оценка последствий\", crit: true, e: 0.26,\n    does: \"Считает, что рушится\", barrier: \"Последствия оценивает сам\",\n    quote: \"«Мы прилетим намного позже»\", tobe: \"Оценка влияния на стыковки\" },\n  { num: \"4\", short: \"Поиск информации\", crit: false, e: 0.38,\n    does: \"Стойка, горячая линия, попутчики\", barrier: \"Непонятно, какой источник верный\",\n    quote: \"«Пытались понять, сколько ждать рейс»\", tobe: \"Единый статус рейса\" },\n  { num: \"5\", short: \"Принятие решений\", crit: false, e: 0.3,\n    does: \"Новые билеты, такси, объезд\", barrier: \"Решения в стрессе и за свой счёт\",\n    quote: \"«Пришлось переплачивать и ехать через Москву»\", tobe: \"Альтернативные маршруты\" },\n  { num: \"6\", short: \"Продолжение поездки\", crit: false, e: 0.44,\n    does: \"Питание, размещение, ожидание\", barrier: \"Очереди, статус услуг неизвестен\",\n    quote: \"\", tobe: \"Ваучеры и статус услуг\" },\n  { num: \"7\", short: \"Работодатель или вуз\", crit: true, e: 0.2,\n    does: \"Объясняет опоздание\", barrier: \"Нет подтверждающего документа\",\n    quote: \"«Нужно было объяснить, почему я опоздал»\", tobe: \"Электронная справка о задержке\" },\n  { num: \"8\", short: \"Компенсация\", crit: true, e: 0.14,\n    does: \"Ищет, куда обращаться\", barrier: \"О праве не знают, порядок непонятен\",\n    quote: \"«Я даже не думала о компенсации»\", tobe: \"Единое окно претензии\" }\n];\n\nclass Component extends DCLogic {\n  state = { tag: 0, pokes: 0, guesses: {}, tabs: {}, stage: 2 };\n\n\n\n\n\n  bump(patch) {\n    this.setState(s => Object.assign({ pokes: s.pokes + 1 }, typeof patch === \"function\" ? patch(s) : patch));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const nda = this.props.ndaMode ?? \"Обезличенно\";\n    const open = nda === \"С названиями\";\n    const honest = this.props.honestTone ?? false;\n    const pill = (on, bg, fg) => on ? { bg, fg } : { bg: PAPER, fg: MUTED };\n\n    const hyps = HYPS.map((h, i) => {\n      const g = s.guesses[i];\n      const right = g && ((g === \"bad\") === h.bad);\n      let verdict = \"Ставка не сделана — выберите вариант.\";\n      let bg = SOFT, fg = MUTED;\n      if (g) {\n        verdict = (right ? \"В точку. \" : \"Мимо. \") + h.verdict;\n        bg = right ? GREEN_BG : RED_BG;\n        fg = right ? GREEN_FG : RED_FG;\n      }\n      const sel = b => ({\n        bg: g === b ? INK : PAPER,\n        fg: g === b ? \"oklch(0.97 0.02 95)\" : \"oklch(0.3 0.04 272)\",\n        border: g === b ? INK : \"oklch(0.26 0.04 272 / 0.18)\"\n      });\n      return {\n        num: String(i + 1), block: h.block, checked: h.checked, verdict, bg, fg,\n        badDot: g === \"bad\" ? INK : \"transparent\", okDot: g === \"ok\" ? INK : \"transparent\",\n        badSel: g === \"bad\" ? \"1\" : \"0\", okSel: g === \"ok\" ? \"1\" : \"0\",\n        onBad: () => this.bump(st => ({ guesses: Object.assign({}, st.guesses, { [i]: \"bad\" }) })),\n        onOk: () => this.bump(st => ({ guesses: Object.assign({}, st.guesses, { [i]: \"ok\" }) }))\n      };\n    });\n    const made = Object.keys(s.guesses).length;\n    const hits = Object.keys(s.guesses).filter(i => (s.guesses[i] === \"bad\") === HYPS[i].bad).length;\n    const guessScore = made === 0 ? \"Ставок: 0 из 6\" : \"Угадано \" + hits + \" из \" + made;\n\n    const steps = STEPS.map(st => ({\n      num: st.num, title: st.title, text: st.text, cause: st.cause,\n      bg: st.ok ? GREEN_BG : RED_BG, fg: st.ok ? GREEN_FG : RED_FG\n    }));\n\n    const findings = FINDINGS.map((f, i) => {\n      const t = s.tabs[i] ?? 0;\n      const set = n => () => this.bump(st => ({ tabs: Object.assign({}, st.tabs, { [i]: n }) }));\n      const p = n => t === n\n        ? { bg: INK, fg: \"oklch(0.97 0.02 95)\", br: INK }\n        : { bg: PAPER, fg: \"oklch(0.32 0.04 272)\", br: \"oklch(0.26 0.04 272 / 0.22)\" };\n      return {\n        sev: f.sev, sevBg: f.crit ? RED_BG : AMBER_BG, sevFg: f.crit ? RED_FG : AMBER_FG,\n        meta: f.meta, title: f.title,\n        body: t === 0 ? f.fact : t === 1 ? f.interp : f.rec,\n        onFact: set(0), onInt: set(1), onRec: set(2),\n        sel0: t === 0 ? \"1\" : \"0\", sel1: t === 1 ? \"1\" : \"0\", sel2: t === 2 ? \"1\" : \"0\"\n      };\n    });\n\n    const COL = 180;\n    const X = i => 90 + i * COL;\n    const Y = e => Math.round(22 + (1 - e) * 96);\n    const points = STAGES.map((st, i) => {\n      const on = s.stage === i;\n      const y = Y(st.e);\n      return {\n        num: st.num, short: st.short, does: st.does, barrier: st.barrier,\n        quote: st.quote || \"—\",\n        quote: st.quote || \"—\", tobe: st.tobe,\n        x: Math.round(X(i)), y, hit: 30,\n        r: on ? 12 : st.crit ? 9 : 7,\n        fill: st.crit ? RED_FG : BLUE,\n        critLabel: st.crit ? \"критическая точка\" : \"этап пути\",\n        critBg: st.crit ? RED_BG : SOFT,\n        critFg: st.crit ? RED_FG : MUTED,\n        sel: on ? \"1\" : \"0\", critFlag: st.crit ? \"1\" : \"0\",\n        cellBg: on ? \"oklch(0.955 0.03 258)\" : PAPER,\n        headBg: on ? INK : (st.crit ? RED_BG : SOFT),\n        headFg: on ? \"oklch(0.97 0.02 95)\" : (st.crit ? RED_FG : INK),\n        onClick: () => this.bump({ stage: i })\n      };\n    });\n    const curve = STAGES.map((st, i) => Math.round(X(i)) + \",\" + Y(st.e)).join(\" \");\n\n    return {\n      pokeDisplay: s.pokes > 0 ? \"block\" : \"none\",\n      pokeText: s.pokes < 3 ? \"Потыкано: \" + s.pokes\n        : s.pokes < 10 ? \"Потыкано: \" + s.pokes + \" — уже похоже на юзабилити-тест\"\n        : s.pokes < 100 ? \"Потыкано: \" + s.pokes + \" · вы бы мне подошли в респонденты\"\n        : \"Потыкано: \" + s.pokes + \" · всё, беру вас в выборку — пишите в телеграм\",\n      tagline: TAGLINES[s.tag % TAGLINES.length],\n      nextTag: () => this.bump(st => ({ tag: st.tag + 1 })),\n      hyps, guessScore, steps, findings, points, curve,\n      resetGuesses: () => this.bump({ guesses: {} }),\n      work1: honest\n        ? \"Стараюсь заранее понять, какое решение команда примет по результатам, и обсудить это с руководителем и заказчиком. От этого зависит дизайн исследования: метод подбираю под вопрос, а не наоборот.\"\n        : \"Начинаю с вопроса, какое решение команда примет по результатам, и от него собираю дизайн исследования. Проблемы отдаю приоритизированными — по критичности и первопричине ошибки, чтобы дизайнер и разработчик понимали, что чинить первым.\",\n      work2: honest\n        ? \"Люблю момент, когда «и так всё понятно» встречается с первым респондентом. Решения принимает продуктовая команда — моя часть в том, чтобы находки были аргументированы и разговор шёл о причине проблемы, а не о размере выборки. Многозадачность и труднодоступные выборки — рабочая рутина, дедлайны держу.\"\n        : \"Спокойно работаю в многозадачности и с труднодоступными выборками, соблюдаю дедлайны и сама планирую нагрузку. Умею говорить о сложных находках просто — на языке команды и стейкхолдеров.\",\n      caseTitle: open\n        ? \"Сервис «Инспектор»: почему дистанционная проверка возвращается к личному визиту\"\n        : \"Дистанционные проверки: почему проверка по видеосвязи возвращается к личному визиту\",\n      client: open\n        ? \"Минэкономразвития РФ. B2B/B2G экосистема для дистанционных проверок ведомствами\"\n        : \"Федеральное ведомство. B2G-сервис дистанционных проверок для контрольно-надзорных органов\",\n      client2: open\n        ? \"Аналитический центр при Правительстве РФ, по поручению Аппарата Правительства. Программа клиентоцентричности, проект «Жизненные ситуации» (Госуслуги)\"\n        : \"Федеральная программа клиентоцентричности: сквозные сценарии вокруг жизненного события, а не вокруг ведомств\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

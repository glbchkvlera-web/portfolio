 border: 2px solid oklch(0.26 0.04 272 / 0.2); color: oklch(0.32 0.04 272); font-size: 15px; font-weight: 700; text-decoration: none; border-radius: 999px\" style-hover=\"border-color: oklch(0.26 0.04 272)\">Резюме, PDF<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <aside style=\"display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 24px\">\n        <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 16px\">Год в лаборатории<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; gap: 12px; align-items: center\"><span style=\"font-family: Nunito, system-ui, sans-serif; font-size: 38px; font-weight: 900; line-height: 0.9; color: oklch(0.52 0.19 258)\">35+<\u002Fspan><span style=\"font-size: 14px; font-weight: 600; line-height: 1.3\">интервью и юзабилити-тестов<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: center\"><span style=\"font-family: Nunito, system-ui, sans-serif; font-size: 38px; font-weight: 900; line-height: 0.9; color: oklch(0.52 0.19 258)\">4<\u002Fspan><span style=\"font-size: 14px; font-weight: 600; line-height: 1.3\">федеральных продукта<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: center\"><span style=\"font-family: Nunito, system-ui, sans-serif; font-size: 38px; font-weight: 900; line-height: 0.9; color: oklch(0.52 0.19 258)\">3<\u002Fspan><span style=\"font-size: 14px; font-weight: 600; line-height: 1.3\">сводных отчёта по команде<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 24px\">\n        <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 12px\">Методы<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 7px\">\n          <span style=\"font-size: 13px; font-weight: 600; padding: 7px 12px; background: oklch(0.955 0.015 272); border-radius: 999px\">Глубинные интервью<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; padding: 7px 12px; background: oklch(0.955 0.015 272); border-radius: 999px\">Юзабилити-тесты<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; padding: 7px 12px; background: oklch(0.955 0.015 272); border-radius: 999px\">UX-аудит<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; padding: 7px 12px; background: oklch(0.955 0.015 272); border-radius: 999px\">Кабинетные исследования<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; padding: 7px 12px; background: oklch(0.955 0.015 272); border-radius: 999px\">CJM as-is / to-be<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; padding: 7px 12px; background: oklch(0.955 0.015 272); border-radius: 999px\">Опросы<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; padding: 7px 12px; background: oklch(0.955 0.015 272); border-radius: 999px\">SUS · CSI · NPS · TSR<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; padding: 7px 12px; background: oklch(0.955 0.015 272); border-radius: 999px\">Айтрекинг (в паре с нейрофизиологом)<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.955 0.05 95); border-radius: 28px; padding: 18px 22px; font-size: 13px; line-height: 1.6; font-weight: 600; color: oklch(0.42 0.05 80)\">Проекты под NDA: формулировки обезличены, скриншотов и внутренних цифр нет.&nbsp;<\u002Fdiv>\n    <\u002Faside>\n  <\u002Fsection>\n\n  <section id=\"case\" style=\"margin-bottom: 88px\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px\">\n      <span style=\"padding: 8px 16px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); border-radius: 999px; font-family: Nunito, system-ui, sans-serif; font-size: 16px; font-weight: 800\">Кейс 1<\u002Fspan>\n      <span style=\"padding: 8px 14px; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 999px; font-size: 13px; font-weight: 700\">госсектор · B2G<\u002Fspan>\n      <span style=\"padding: 8px 14px; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 999px; font-size: 13px; font-weight: 700\">2026<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 46px; line-height: 1.08; letter-spacing: -0.015em; margin: 0 0 16px; max-width: 26ch\">{{ caseTitle }}<\u002Fh2>\n    <p style=\"font-size: 20px; line-height: 1.55; font-weight: 600; margin: 0 0 36px; max-width: 62ch; color: oklch(0.34 0.04 272)\">Инспекторы должны проверять бизнес по видеосвязи и закрывать мероприятие в приложении. На практике многие снова едут лично. Я выясняла, где именно сервис их к этому подталкивает.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 48px\">\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 22px; padding: 18px 20px\">\n        <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Моя роль<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">Дизайн исследования, все сессии, анализ, отчёт и сводный отчёт по команде<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 22px; padding: 18px 20px\">\n        <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Заказчик<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">{{ client }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 22px; padding: 18px 20px\">\n        <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Этапы<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">Макеты — UX-аудит, чек-листы эргономики, экспертная оценка<br>Прод — юзабилити-тесты и интервью<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 22px; padding: 18px 20px\">\n        <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Цель заказчика<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">Меньше нагрузки на инспекторов и бизнес, больше проверок, доведённых до конца дистанционно<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 56px\">\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 28px 30px\">\n        <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">1 · контекст<\u002Fdiv>\n        <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 26px; line-height: 1.2; margin: 0 0 12px\">Формально всё работало<\u002Fh3>\n        <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 12px; color: oklch(0.38 0.03 272)\">Сервис задумали как замену выездным проверкам: инспектор создаёт мероприятие, приглашает контролируемое лицо — то есть проверяемую организацию или предпринимателя, — проводит осмотр или консультирование и фиксирует результат. Путь собран, приёмка пройдена, сервис в проде.<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 12px; color: oklch(0.38 0.03 272)\">А в статистике и обращениях — другая картина: мероприятия не доходят до зачёта, документы просят прислать «по старинке», часть проверок всё равно превращается в личный визит. Где ломается — в интерфейсе или вокруг него — команда не знала.<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 1.7; margin: 0; color: oklch(0.38 0.03 272)\">Ставка высокая: пользователь — должностное лицо. Ошибка в карточке это не потерянная минута, а сорванная отчётность и разговор с бизнесом.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.955 0.05 95); border-radius: 28px; padding: 28px 30px\">\n        <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.99 0.01 95); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">2 · вопросы<\u002Fdiv>\n        <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 26px; line-height: 1.2; margin: 0 0 14px\">Что я хотела узнать<\u002Fh3>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.55; font-weight: 600\">\n          <div style=\"display: flex; gap: 10px\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 999px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 2px\">1<\u002Fspan><span>Дойдёт ли инспектор от создания мероприятия до зачёта самостоятельно — без коллег и техподдержки?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 999px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 2px\">2<\u002Fspan><span>На каких шагах он останавливается, действует наугад или уходит в сторонние программы?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 999px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 2px\">3<\u002Fspan><span>Что вызывает страх ошибки и каких действий инспектор избегает вовсе?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 999px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 2px\">4<\u002Fspan><span>Насколько удобным он считает сервис после первого самостоятельного использования?<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 14px; line-height: 1.6; margin: 16px 0 0; font-weight: 600; color: oklch(0.44 0.05 80)\">Тестировали один сквозной сценарий — «Проведение консультирования инспектором в веб-версии»: от создания мероприятия до завершения.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272); border-radius: 32px; box-shadow: 6px 6px 0 oklch(0.26 0.04 272 / 0.1); padding: 32px 30px; margin-bottom: 56px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between\">\n        <div>\n          <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.9 0.1 130); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px\">Гипотезы · можно сыграть<\u002Fdiv>\n          <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 30px; line-height: 1.15; margin: 0 0 8px\">Угадайте, где сломалось<\u002Fh3>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0; max-width: 58ch; font-weight: 600; color: oklch(0.44 0.04 272)\">Инспектор проходит проверку по видеосвязи в шесть шагов. Экранов вы не видели — это нормально: просто прикиньте по описанию шага, где человек, скорее всего, застрянет. Ставьте «тут барьер» или «тут норм» и смотрите, что показали сессии.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"padding: 9px 14px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 14px; font-weight: 700\">{{ guessScore }}<\u002Fspan><button sc-camel-on-click=\"{{ resetGuesses }}\" style=\"padding: 9px 14px; background: none; border: 2px solid oklch(0.26 0.04 272 / 0.18); border-radius: 999px; font-size: 13px; font-weight: 700; color: oklch(0.44 0.04 272)\" style-hover=\"border-color: oklch(0.26 0.04 272)\">Сбросить<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; margin-top: 24px\">\n        <sc-for list=\"{{ hyps }}\" as=\"h\" hint-placeholder-count=\"6\">\n          <div style=\"border: 2px solid oklch(0.26 0.04 272 / 0.12); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: oklch(0.98 0.008 95)\">\n            <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272)\">Шаг {{ h.num }} из 6<\u002Fdiv>\n            <div style=\"font-size: 17px; font-weight: 800; line-height: 1.25\">{{ h.block }}<\u002Fdiv>\n            <div style=\"font-size: 14px; line-height: 1.55; font-weight: 500; color: oklch(0.44 0.03 272); flex: 1\">{{ h.checked }}<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px\">\n              <button sc-camel-on-click=\"{{ h.onBad }}\" data-sel=\"{{ h.badSel }}\" style=\"flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px; border-radius: 999px; border: 2px solid oklch(0.26 0.04 272 / 0.18); font-size: 13px; font-weight: 700; background: oklch(0.99 0.008 95); color: oklch(0.3 0.04 272); transition: none\">Тут барьер<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ h.onOk }}\" data-sel=\"{{ h.okSel }}\" style=\"flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px; border-radius: 999px; border: 2px solid oklch(0.26 0.04 272 / 0.18); font-size: 13px; font-weight: 700; background: oklch(0.99 0.008 95); color: oklch(0.3 0.04 272); transition: none\">Тут норм<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size: 13px; line-height: 1.5; font-weight: 700; min-height: 40px; padding: 10px 12px; border-radius: 16px; background: {{ h.bg }}; color: {{ h.fg }}\"><span>{{ h.verdict }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 24px; padding-top: 22px; border-top: 2px dashed oklch(0.26 0.04 272 / 0.13)\">\n        <div>\n          <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Опровергать тоже полезно<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.38 0.04 272)\">Два блока, которые считались проблемными — запуск веб-версии и управление трансляцией (камера, демонстрация экрана, прокрутка), — на тесте инспекторы прошли без затруднений. Это снятые с очереди доработки: ресурс разработки ушёл туда, где барьеры реальны.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Что забрала в метод<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.38 0.04 272)\">Часть барьеров лежала вне гипотез — они пришли из наблюдения и дебрифинга. Поэтому я не свожу тест к проверке списка: формулирую гипотезы как барьеры внутри сквозного сценария, оставляю место свободному поведению и всегда добавляю интервью о рабочем контексте.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 56px\">\n      <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">3 · методология<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 32px; line-height: 1.15; margin: 0 0 20px\">Как я это собрала<\u002Fh3>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px\">\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px; border-top: 4px solid oklch(0.62 0.2 258)\">\n          <div style=\"font-family: Nunito, system-ui, sans-serif; font-size: 21px; font-weight: 800; margin-bottom: 6px\">Юзабилити-тесты · 6<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; font-weight: 500; color: oklch(0.4 0.03 272)\">Весь сценарий «Консультирование» целиком. Думай-вслух, без подсказок, фиксация успешности каждой задачи и первопричины ошибки.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px; border-top: 4px solid oklch(0.62 0.2 258)\">\n          <div style=\"font-family: Nunito, system-ui, sans-serif; font-size: 21px; font-weight: 800; margin-bottom: 6px\">Интервью после теста<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; font-weight: 500; color: oklch(0.4 0.03 272)\">Полуструктурированное — про рабочий день, соседние системы и отчётность. Именно оно вывело проблемы за пределы интерфейса.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px; border-top: 4px solid oklch(0.62 0.2 258)\">\n          <div style=\"font-family: Nunito, system-ui, sans-serif; font-size: 21px; font-weight: 800; margin-bottom: 6px\">Айтрекинг и ЭЭГ<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; font-weight: 500; color: oklch(0.4 0.03 272)\">Тепловые карты и порядок просмотра — чтобы отличить «не увидел элемент» от «увидел и не понял». Сессии — в паре со специалистом-нейрофизиологом.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px; border-top: 4px solid oklch(0.62 0.2 258)\">\n          <div style=\"font-family: Nunito, system-ui, sans-serif; font-size: 21px; font-weight: 800; margin-bottom: 6px\">Опросник SUS<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; font-weight: 500; color: oklch(0.4 0.03 272)\">Сразу после сессии. Собирала и считала сама — как опорная точка для повторного замера после доработок.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 26px 28px\">\n        <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 10px\">Формат модерации<\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.65; margin: 0 0 18px; max-width: 70ch; font-weight: 600\">Тест модерируемый, но степень модерации я меняла по этапам — когда параллельно снимаются нейропоказатели, это принципиально.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px\">\n          <div style=\"background: oklch(0.955 0.015 272); border-radius: 20px; padding: 18px 20px\">\n            <div style=\"font-size: 15px; font-weight: 800; margin-bottom: 8px\">Пока идёт запись \"нейрометрик\" — минимум вмешательства<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; font-weight: 500; color: oklch(0.42 0.03 272)\">Я рядом, но без подсказок, уточнений и реакций: любое вмешательство сбивает показания — взгляд уходит на модератора, напряжение спадает. В это время веду протокол наблюдения: мимика, паузы, реплики вслух, точки замешательства — чтобы потом сопоставить их с пиками по приборам и конкретными экранами.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.955 0.015 272); border-radius: 20px; padding: 18px 20px\">\n            <div style=\"font-size: 15px; font-weight: 800; margin-bottom: 8px\">Дебрифинг — полная модерация<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; margin: 0; font-weight: 500; color: oklch(0.42 0.03 272)\">Когда нейрооборудование убрали, разбираю по гайду каждый затык: что респондент ожидал увидеть, что его остановило, почему выбрал именно это действие. Большая часть интерпретаций родилась здесь, а не в самих задачах.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 18px; padding-top: 18px; border-top: 2px dashed oklch(0.26 0.04 272 / 0.13)\">\n          <div>\n            <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 6px\">Выборка<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.55; font-weight: 600\">Действующие инспекторы контрольных и лицензирующих органов с реальным опытом дистанционных проверок<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 6px\">Анализ<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.55; font-weight: 600\">Классификация по критичности и по первопричине: не нашёл / не понял / избегал действия / система не позволила<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 6px\">Что получила команда<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.55; font-weight: 600\">Отчёт с приоритизированными рекомендациями плюс сводный отчёт по всей лаборатории<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 56px\">\n      <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">4 · карта затыков<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 32px; line-height: 1.15; margin: 0 0 8px\">Где сценарий разваливается<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.65; margin: 0 0 18px; max-width: 68ch; font-weight: 500; color: oklch(0.44 0.04 272)\">Вместо скриншотов — карта сценария: шаг, что делает инспектор и какая первопричина за этим стоит. Первопричина сразу подсказывает тип решения: перекомпоновать экран, переписать текст и добавить подтверждение — или чинить функциональность.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 20px\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px\">\n              <span style=\"font-family: Nunito, system-ui, sans-serif; font-size: 20px; font-weight: 800; color: oklch(0.6 0.03 272)\">{{ s.num }}<\u002Fspan>\n              <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: {{ s.bg }}; color: {{ s.fg }}\">{{ s.cause }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size: 16px; font-weight: 800; line-height: 1.3; margin-bottom: 8px\">{{ s.title }}<\u002Fdiv>\n            <div style=\"font-size: 14px; line-height: 1.55; font-weight: 500; color: oklch(0.44 0.03 272)\">{{ s.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 30px; margin-bottom: 56px\">\n      <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 10px\">System Usability Scale · веб-версия<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 28px; line-height: 1.15; margin: 0 0 18px; max-width: 34ch\">Удобство — «приемлемо», чуть выше среднего<\u002Fh3>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px\">\n        <div style=\"height: 10px; border-radius: 999px; background: oklch(0.92 0.012 272)\"><\u002Fdiv>\n        <div style=\"height: 10px; border-radius: 999px; background: oklch(0.92 0.012 272)\"><\u002Fdiv>\n        <div style=\"height: 10px; border-radius: 999px; background: oklch(0.62 0.2 258)\"><\u002Fdiv>\n        <div style=\"height: 10px; border-radius: 999px; background: oklch(0.92 0.012 272)\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 18px\">\n        <span>неприемлемо<\u002Fspan><span>ниже среднего<\u002Fspan><span style=\"color: oklch(0.5 0.19 258)\">приемлемо ←<\u002Fspan><span>отлично<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.7; margin: 0; font-weight: 500; color: oklch(0.38 0.04 272); max-width: 74ch\">Собирала и считала сама, сразу после каждой сессии. Как я это читаю: метрика не диагностична, она лишь фиксирует, что сервис не вызывает негатива. Содержательное — характер ответов: инспекторы считают процесс использования непонятным и не уверены, что справятся без поддержки специалиста. Не отторжение, а неуверенность — и её объясняют находки ниже.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 56px\">\n      <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">5 · находки<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 32px; line-height: 1.15; margin: 0 0 8px\">Факт → интерпретация → решение<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.65; margin: 0 0 18px; max-width: 68ch; font-weight: 500; color: oklch(0.44 0.04 272)\">Четыре главные проблемы сценария. Переключайте шаги внутри карточки — от того, что было видно на сессии, к тому, что я предложила.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 12px\">\n        <sc-for list=\"{{ findings }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <article style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 26px 28px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px\">\n              <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; padding: 6px 12px; border-radius: 999px; background: {{ f.sevBg }}; color: {{ f.sevFg }}\">{{ f.sev }}<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 700; color: oklch(0.55 0.03 272)\">{{ f.meta }}<\u002Fspan>\n            <\u002Fdiv>\n            <h4 style=\"font-size: 21px; font-weight: 800; line-height: 1.3; margin: 0 0 16px; max-width: 62ch\">{{ f.title }}<\u002Fh4>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px\">\n              <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-right: 2px\">Смотреть →<\u002Fspan>\n              <button sc-camel-on-click=\"{{ f.onFact }}\" data-sel=\"{{ f.sel0 }}\" style=\"padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 2px solid oklch(0.26 0.04 272 / 0.22); background: oklch(0.99 0.008 95); color: oklch(0.32 0.04 272); transition: none\">Что видела<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ f.onInt }}\" data-sel=\"{{ f.sel1 }}\" style=\"padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 2px solid oklch(0.26 0.04 272 / 0.22); background: oklch(0.99 0.008 95); color: oklch(0.32 0.04 272); transition: none\">Что это значит<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ f.onRec }}\" data-sel=\"{{ f.sel2 }}\" style=\"padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 2px solid oklch(0.26 0.04 272 / 0.22); background: oklch(0.99 0.008 95); color: oklch(0.32 0.04 272); transition: none\">Что делать<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"font-size: 17px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.34 0.04 272); max-width: 76ch; min-height: 84px; background: oklch(0.955 0.015 272); border-radius: 20px; padding: 18px 20px\">{{ f.body }}<\u002Fp>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: oklch(0.31 0.07 275); color: oklch(0.96 0.02 95); border-radius: 36px; padding: 44px 40px; margin-bottom: 56px\">\n      <div style=\"display: inline-flex; padding: 6px 14px; background: oklch(0.9 0.1 130); color: oklch(0.26 0.05 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px\">6 · главное<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 38px; line-height: 1.12; margin: 0 0 16px; max-width: 30ch\">Самое важное нашлось не в интерфейсе<\u002Fh3>\n      <p style=\"font-size: 18px; line-height: 1.7; margin: 0 0 28px; max-width: 66ch; font-weight: 500; color: oklch(0.88 0.02 95)\">Юзабилити-тесты объяснили, почему инспектор спотыкается на экране. Интервью объяснили, почему он вообще предпочитает не пользоваться сервисом: в критические моменты цифровизация не облегчает труд, а умножает его — сразу для обеих сторон. Эти четыре паттерна я вынесла в отчёт отдельным блоком, вне интерфейсных гипотез.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px\">\n        <div style=\"background: oklch(0.37 0.06 275); border-radius: 24px; padding: 22px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.25\">Систем много, работы больше<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 12px; font-weight: 500; color: oklch(0.87 0.02 95)\">Одни и те же данные инспектор ведёт в 3–4 несинхронизированных системах, документы дублирует вручную, а сбой без автосохранения обнуляет работу.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.5; margin: 0; font-weight: 700; color: oklch(0.9 0.1 130)\">«Каждая новая система не отменяет предыдущую»<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.37 0.06 275); border-radius: 24px; padding: 22px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.25\">Лимиты обесценивают работу<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 12px; font-weight: 500; color: oklch(0.87 0.02 95)\">Мероприятие короче нескольких минут не идёт в статистику, даже если инспектор ответил на все вопросы. Эффективность подменяется порогом по длительности.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.5; margin: 0; font-weight: 700; color: oklch(0.9 0.1 130)\">«Это в зачёт не идёт, хотя нами было потрачено время»<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.37 0.06 275); border-radius: 24px; padding: 22px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.25\">Инспектор в роли техподдержки<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 12px; font-weight: 500; color: oklch(0.87 0.02 95)\">Бизнес опасается устанавливать приложение, и инспектор тратит часть рабочего дня на уговоры и техпомощь. Сбои авторизации бьют по его репутации.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.5; margin: 0 0 6px; font-weight: 700; color: oklch(0.9 0.1 130)\">«Инспектор не должен выступать в роли техподдержки»<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.5; margin: 0; font-weight: 700; color: oklch(0.9 0.1 130)\">«То, что они соглашаются — это большая услуга… стыдно мне»<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.37 0.06 275); border-radius: 24px; padding: 22px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.25\">Технические лимиты возвращают в офлайн<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 12px; font-weight: 500; color: oklch(0.87 0.02 95)\">Ограничение объёма файлов не даёт передать материалы, сами материалы формируются от часа до суток, видеозаписи иногда нет — и проверка не засчитывается.<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.5; margin: 0; font-weight: 700; color: oklch(0.9 0.1 130)\">Итог: тот самый личный визит, ради отмены которого сервис и делали.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">7 · влияние<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 32px; line-height: 1.15; margin: 0 0 20px\">Что изменилось после<\u002Fh3>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px\">\n        <div style=\"display: flex; gap: 14px; align-items: start; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.11); border-radius: 20px; padding: 18px 20px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.9 0.1 130); font-size: 13px; font-weight: 800; display: grid; place-items: center\">1<\u002Fspan><p style=\"font-size: 16px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.36 0.04 272)\">Рекомендации ушли в бэклог с приоритетом по критичности: формулировки и подтверждения — в ближайший релиз, редактирование карточки и адресный поиск — как продуктовые доработки.<\u002Fp><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; align-items: start; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.11); border-radius: 20px; padding: 18px 20px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.9 0.1 130); font-size: 13px; font-weight: 800; display: grid; place-items: center\">2<\u002Fspan><p style=\"font-size: 16px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.36 0.04 272)\">Блок системных проблем сместил разговор с заказчиком: от отдельных кнопок к интеграции с соседними системами и к критерию зачёта мероприятия — то есть к причинам, а не симптомам.<\u002Fp><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; align-items: start; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.11); border-radius: 20px; padding: 18px 20px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.9 0.1 130); font-size: 13px; font-weight: 800; display: grid; place-items: center\">3<\u002Fspan><p style=\"font-size: 16px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.36 0.04 272)\">Замер SUS зафиксирован как базовая точка: повторный замер после доработок покажет эффект количественно.<\u002Fp><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; align-items: start; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.11); border-radius: 20px; padding: 18px 20px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.9 0.1 130); font-size: 13px; font-weight: 800; display: grid; place-items: center\">4<\u002Fspan><p style=\"font-size: 16px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.36 0.04 272)\">Я собрала сводный отчёт по всей лаборатории — он стал единым документом для защиты приоритетов перед заказчиком.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px\">\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px 24px\">\n          <h4 style=\"font-size: 18px; font-weight: 800; margin: 0 0 10px\">Ограничения — честно<\u002Fh4>\n          <p style=\"font-size: 15px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.4 0.04 272)\">Выборка небольшая и труднодоступная: действующие инспекторы, сессии в согласованные ведомством окна. Статистики такой объём не даёт, поэтому количественные выводы я ограничила SUS и долей респондентов с проблемой, остальное — качественные находки. Часть барьеров относится к мобильной версии контролируемого лица, которую в этой волне не тестировали.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px 24px\">\n          <h4 style=\"font-size: 18px; font-weight: 800; margin: 0 0 10px\">Что забрала себе<\u002Fh4>\n          <p style=\"font-size: 15px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.4 0.04 272)\">Гипотезы команды подтвердились слабо — и это оказалось полезным результатом: они описывали интерфейс, а потери были в стыках систем и в правилах отчётности. С тех пор после юзабилити-теста я всегда закладываю интервью о рабочем контексте. Без него был бы отчёт про кнопки, а не про то, почему сервисом не пользуются.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"case2\" style=\"margin-bottom: 88px\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px\">\n      <span style=\"padding: 8px 16px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); border-radius: 999px; font-family: Nunito, system-ui, sans-serif; font-size: 16px; font-weight: 800\">Кейс 2<\u002Fspan>\n      <span style=\"padding: 8px 14px; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 999px; font-size: 13px; font-weight: 700\">госсектор · B2C · сквозной путь<\u002Fspan>\n      <span style=\"padding: 8px 14px; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 999px; font-size: 13px; font-weight: 700\">2026&nbsp;<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 46px; line-height: 1.08; letter-spacing: -0.015em; margin: 0 0 16px; max-width: 26ch\">Рейс задержали. Дальше пассажир \"собирает\" путь сам<\u002Fh2>\n    <p style=\"font-size: 20px; line-height: 1.55; font-weight: 600; margin: 0 0 14px; max-width: 62ch; color: oklch(0.34 0.04 272)\">Задержка или отмена — это не одна услуга, а десяток разрозненных действий: узнать причину, поменять маршрут, получить питание и гостиницу, объясниться с работодателем, добиться компенсации. Я описала этот путь целиком, чтобы государство могло собрать его в один сервис.<\u002Fp>\n    <p style=\"font-size: 15px; line-height: 1.65; margin: 0 0 36px; max-width: 62ch; font-weight: 500; color: oklch(0.46 0.03 272)\">Проект программы клиентоцентричности: жизненные ситуации проектируют вокруг события в жизни человека, а не вокруг ведомств. Эту ситуацию я вела вместе со второй — «Целевое обучение».<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 48px\">\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 22px; padding: 18px 20px\">\n        <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Моя роль<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">Дизайн исследования, все интервью, кабинетное исследование, CJM as-is / to-be, отчёт<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 22px; padding: 18px 20px\">\n        <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Заказчик<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">{{ client2 }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 22px; padding: 18px 20px\">\n        <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Методы<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">Глубинные интервью, кабинетное исследование, карта клиентского пути, сегментация<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 22px; padding: 18px 20px\">\n        <div style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.03 272); margin-bottom: 8px\">Задача<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.45; font-weight: 600\">Описать текущий путь, найти критические точки, предложить целевой путь для новой жизненной ситуации<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 56px\">\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 28px 30px\">\n        <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">1 · задача<\u002Fdiv>\n        <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 26px; line-height: 1.2; margin: 0 0 12px\">Пути «как есть» ни у кого не было<\u002Fh3>\n        <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 12px; font-weight: 500; color: oklch(0.38 0.03 272)\">Формально права есть: на информацию, питание, размещение, компенсацию. Фактически каждым пунктом занимается кто-то свой — перевозчик, аэропорт, туроператор, страховая, работодатель. Целиком путь не видел никто, поэтому и улучшать было нечего.<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 1.7; margin: 0; font-weight: 500; color: oklch(0.38 0.03 272)\">Моя задача — описать реальный путь по шагам, найти критические точки, где человек прерывает путь или несёт потери, и на этой основе предложить целевой путь.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.955 0.05 95); border-radius: 28px; padding: 28px 30px\">\n        <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.99 0.01 95); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">Вопросы исследования<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.55; font-weight: 600\">\n          <div style=\"display: flex; gap: 10px\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 999px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 2px\">1<\u002Fspan><span>Как человек узнаёт о нарушении поездки и что делает в первые минуты?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 999px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 2px\">2<\u002Fspan><span>Какие решения он принимает сам, потому что помощи не ждёт — и чего это ему стоит?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 999px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 2px\">3<\u002Fspan><span>Где путь рвётся: какие данные и документы приходится собирать и вводить повторно?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px\"><span style=\"flex: none; width: 22px; height: 22px; border-radius: 999px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 2px\">4<\u002Fspan><span>Почему люди с реальными потерями не доходят до компенсации?<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 56px\">\n      <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">2 · метод<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 32px; line-height: 1.15; margin: 0 0 20px\">Как собирала данные<\u002Fh3>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px\">\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px; border-top: 4px solid oklch(0.62 0.2 258)\">\n          <div style=\"font-family: Nunito, system-ui, sans-serif; font-size: 21px; font-weight: 800; margin-bottom: 6px\">Кабинетное исследование<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; font-weight: 500; color: oklch(0.4 0.03 272)\">Нормативная база, статистика, публикации, обращения — чтобы отделить «человеку не положено» от «положено, но он об этом не знает». Это различение стало ключевым для всего проекта.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px; border-top: 4px solid oklch(0.62 0.2 258)\">\n          <div style=\"font-family: Nunito, system-ui, sans-serif; font-size: 21px; font-weight: 800; margin-bottom: 6px\">Сегментация<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; font-weight: 500; color: oklch(0.4 0.03 272)\">Четыре группы, различающиеся не транспортом, а структурой риска: прямой рейс, стыковка, оставшиеся в салоне после посадки, отмена и чартер.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px; border-top: 4px solid oklch(0.62 0.2 258)\">\n          <div style=\"font-family: Nunito, system-ui, sans-serif; font-size: 21px; font-weight: 800; margin-bottom: 6px\">Глубинные интервью · 10<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; font-weight: 500; color: oklch(0.4 0.03 272)\">Пассажиры 18–47 лет из разных регионов, авиа и железная дорога. Все не просто попали в задержку, но и проходили путь дальше: разбирались, взаимодействовали с перевозчиком, пробовали оформить компенсацию.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px; border-top: 4px solid oklch(0.62 0.2 258)\">\n          <div style=\"font-family: Nunito, system-ui, sans-serif; font-size: 21px; font-weight: 800; margin-bottom: 6px\">CJM as-is / to-be<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; font-weight: 500; color: oklch(0.4 0.03 272)\">Слои: триггер этапа, цели, действия, каналы, ожидания, эмоции, цитаты, барьеры, критические точки, услуги, документы, повторный запрос сведений, инсайты. Отдельным слоем — предложения to-be с результатом и эффектом.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.955 0.05 95); border-radius: 24px; padding: 20px 24px; font-size: 16px; line-height: 1.65; font-weight: 600; max-width: 80ch\">Самый полезный слой карты — «повторный запрос тех же сведений». Он превращает общее «здесь много бюрократии» в измеримый дефект пути: видно, сколько раз человек вводит одни и те же данные о рейсе и билете.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272); border-radius: 32px; box-shadow: 6px 6px 0 oklch(0.26 0.04 272 / 0.1); padding: 32px 30px; margin-bottom: 56px\">\n      <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.9 0.1 130); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px\">3 · карта пути<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 32px; line-height: 1.15; margin: 0 0 8px\">Карта пути пассажира, as-is → to-be<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.65; margin: 0 0 16px; max-width: 72ch; font-weight: 500; color: oklch(0.44 0.04 272)\">Схема по мотивам рабочей карты — компактнее, чем в отчёте: восемь этапов, состояние человека, действия, ключевой барьер, цитата и направление to-be. Красным — критические точки, где путь чаще всего обрывается.<\u002Fp>\n      <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.03 272)\">\n        <span>Листайте карту<\u002Fspan><span style=\"font-size: 15px\">→<\u002Fspan>\n      <\u002Fdiv>\n      <div data-cjm-scroll=\"main\" style=\"overflow-x: auto; padding-bottom: 4px\">\n        <div style=\"min-width: 1590px; display: grid; grid-template-columns: 150px repeat(8, 180px); align-items: stretch\">\n\n          <div style=\"position: sticky; left: 0; z-index: 2; background: oklch(0.99 0.008 95); display: flex; align-items: end; padding: 0 12px 10px 0; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272)\">Этап<\u002Fdiv>\n          <sc-for list=\"{{ points }}\" as=\"p\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ p.onClick }}\" data-cjm-head=\"{{ p.sel }}\" data-crit=\"{{ p.critFlag }}\" style=\"display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left; margin: 0 3px 6px; padding: 12px 14px; border: 2px solid oklch(0.26 0.04 272 / 0.12); border-radius: 18px; background: oklch(0.955 0.015 272); color: oklch(0.26 0.04 272); transition: none\">\n              <span style=\"font-family: Nunito, system-ui, sans-serif; font-size: 20px; font-weight: 900; opacity: 0.65\">{{ p.num }}<\u002Fspan>\n              <span style=\"font-size: 14px; font-weight: 800; line-height: 1.25\">{{ p.short }}<\u002Fspan>\n              <span data-crit-tag=\"{{ p.critFlag }}\" style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: oklch(0.99 0.008 95); color: oklch(0.4 0.03 272)\">{{ p.critLabel }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n\n          <div style=\"position: sticky; left: 0; z-index: 2; background: oklch(0.99 0.008 95); display: flex; align-items: center; padding: 0 12px 0 0; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272)\">Состояние<\u002Fdiv>\n          <div style=\"grid-column: span 8; position: relative\">\n            <svg sc-camel-view-box=\"0 0 1440 140\" style=\"width: 1440px; height: 140px; display: block\">\n              <line x1=\"0\" y1=\"22\" x2=\"1440\" y2=\"22\" stroke=\"oklch(0.26 0.04 272 / 0.09)\" stroke-width=\"2\" stroke-dasharray=\"6 8\"><\u002Fline>\n              <line x1=\"0\" y1=\"70\" x2=\"1440\" y2=\"70\" stroke=\"oklch(0.26 0.04 272 / 0.09)\" stroke-width=\"2\" stroke-dasharray=\"6 8\"><\u002Fline>\n              <line x1=\"0\" y1=\"118\" x2=\"1440\" y2=\"118\" stroke=\"oklch(0.26 0.04 272 / 0.09)\" stroke-width=\"2\" stroke-dasharray=\"6 8\"><\u002Fline>\n              <polyline points=\"{{ curve }}\" fill=\"none\" stroke=\"oklch(0.62 0.2 258)\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"2400\" style=\"animation: draw 2.2s ease-out forwards\"><\u002Fpolyline>\n              <sc-for list=\"{{ points }}\" as=\"p\" hint-placeholder-count=\"8\">\n                <g sc-camel-on-click=\"{{ p.onClick }}\" style=\"cursor: pointer\">\n                  <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"{{ p.hit }}\" fill=\"oklch(0.62 0.2 258 / 0.001)\"><\u002Fcircle>\n                  <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"{{ p.r }}\" fill=\"{{ p.fill }}\" stroke=\"oklch(0.99 0.008 95)\" stroke-width=\"3\"><\u002Fcircle>\n                <\u002Fg>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <span style=\"position: absolute; top: 2px; left: 6px; font-size: 11px; font-weight: 800; color: oklch(0.62 0.03 272)\">спокойно<\u002Fspan>\n            <span style=\"position: absolute; bottom: 2px; left: 6px; font-size: 11px; font-weight: 800; color: oklch(0.62 0.03 272)\">напряжение и потери<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"position: sticky; left: 0; z-index: 2; background: oklch(0.99 0.008 95); display: flex; align-items: start; padding: 14px 12px 0 0; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272)\">Что делает<\u002Fdiv>\n          <sc-for list=\"{{ points }}\" as=\"p\" hint-placeholder-count=\"8\">\n            <div style=\"margin: 0 3px 6px; padding: 14px; border-radius: 16px; background: {{ p.cellBg }}; border: 2px solid oklch(0.26 0.04 272 / 0.1); font-size: 13px; line-height: 1.5; font-weight: 500; color: oklch(0.34 0.04 272)\">{{ p.does }}<\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"position: sticky; left: 0; z-index: 2; background: oklch(0.99 0.008 95); display: flex; align-items: start; padding: 14px 12px 0 0; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272)\">Барьер<\u002Fdiv>\n          <sc-for list=\"{{ points }}\" as=\"p\" hint-placeholder-count=\"8\">\n            <div style=\"margin: 0 3px 6px; padding: 14px; border-radius: 16px; background: {{ p.cellBg }}; border: 2px solid oklch(0.26 0.04 272 / 0.1); font-size: 13px; line-height: 1.5; font-weight: 600; color: oklch(0.4 0.06 25)\">{{ p.barrier }}<\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"position: sticky; left: 0; z-index: 2; background: oklch(0.99 0.008 95); display: flex; align-items: start; padding: 14px 12px 0 0; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.03 272)\">Цитата<\u002Fdiv>\n          <sc-for list=\"{{ points }}\" as=\"p\" hint-placeholder-count=\"8\">\n            <div style=\"margin: 0 3px 6px; padding: 14px; border-radius: 16px; background: {{ p.cellBg }}; border: 2px dashed oklch(0.26 0.04 272 / 0.13); font-size: 13px; line-height: 1.45; font-weight: 700; color: oklch(0.46 0.16 258)\">{{ p.quote }}<\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"position: sticky; left: 0; z-index: 2; background: oklch(0.99 0.008 95); display: flex; align-items: start; padding: 14px 12px 0 0; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.5 0.13 145)\">Что предложила<\u002Fdiv>\n          <sc-for list=\"{{ points }}\" as=\"p\" hint-placeholder-count=\"8\">\n            <div style=\"margin: 0 3px; padding: 14px; border-radius: 16px; background: oklch(0.96 0.045 145); font-size: 13px; line-height: 1.5; font-weight: 600; color: oklch(0.34 0.09 145)\">{{ p.tobe }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; margin: 16px 0 0; font-weight: 600; color: oklch(0.5 0.03 272); max-width: 70ch\">У части пассажиров этапов 6–8 нет: путь ветвится по длительности задержки, наличию стыковок и размеру потерь. В карте это отдельные сценарии.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: oklch(0.31 0.07 275); color: oklch(0.96 0.02 95); border-radius: 36px; padding: 44px 40px; margin-bottom: 56px\">\n      <div style=\"display: inline-flex; padding: 6px 14px; background: oklch(0.9 0.1 130); color: oklch(0.26 0.05 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px\">4 · главное<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 38px; line-height: 1.12; margin: 0 0 16px; max-width: 32ch\">Интегратором становится человек, а не система<\u002Fh3>\n      <p style=\"font-size: 18px; line-height: 1.7; margin: 0 0 28px; max-width: 66ch; font-weight: 500; color: oklch(0.88 0.02 95)\">Сквозной барьер — не отдельная плохая услуга, а отсутствие сопровождаемого маршрута. Пассажир сам сшивает табло, объявления, сотрудников перевозчика, сайты аэропортов, горячие линии, страховую и работодателя, многократно вводя одни и те же данные о рейсе и билете. Этот разрыв между точками контакта и создаёт основную перегрузку — в момент, когда человек и без того в стрессе.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px\">\n        <div style=\"background: oklch(0.37 0.06 275); border-radius: 24px; padding: 22px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.25\">Неопределённость дороже денег<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0; font-weight: 500; color: oklch(0.87 0.02 95)\">Люди часами не знают ни причины, ни срока задержки. Информация меняется по нескольку раз, а решения надо принимать немедленно — отсюда тревога и ощущение бессилия, а не только финансовые потери.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.37 0.06 275); border-radius: 24px; padding: 22px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.25\">Самопомощь дороже помощи<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0; font-weight: 500; color: oklch(0.87 0.02 95)\">Пассажиры не ждут, что система вмешается, и начинают спасать поездку сами: срочные билеты, такси, объезд. Решения в стрессе стоят дороже организованной альтернативы.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.37 0.06 275); border-radius: 24px; padding: 22px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.25\">Нет справки — нет права<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0; font-weight: 500; color: oklch(0.87 0.02 95)\">Без документа о задержке человек не может объясниться с работодателем или вузом и не может подать претензию. Одна отсутствующая бумага обесценивает сразу два этапа пути.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.37 0.06 275); border-radius: 24px; padding: 22px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.25\">Право есть, обращения нет<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0; font-weight: 500; color: oklch(0.87 0.02 95)\">Большинство респондентов с реальными убытками за компенсацией не обращались: не знали о праве, не понимали порядок, не хотели разбираться в структуре перевозчика. Барьер информационный, а не юридический.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 56px\">\n      <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">5 · сегменты<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 32px; line-height: 1.15; margin: 0 0 8px\">Четыре группы — по структуре риска<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.65; margin: 0 0 18px; max-width: 68ch; font-weight: 500; color: oklch(0.44 0.04 272)\">Сегментация нужна была, чтобы сервис не проектировали «для среднего пассажира»: сценарии этих групп расходятся уже на втором этапе пути.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px\">\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px 24px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px\">Прямой рейс<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 10px; font-weight: 500; color: oklch(0.42 0.03 272)\">Альтернатив нет, остаётся ждать. За компенсацией почти никто не обращается.<\u002Fp>\n          <div style=\"font-size: 13px; font-weight: 700; color: oklch(0.5 0.03 272)\">Риск: потеря времени и срыв личных планов<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px 24px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px\">Стыковочный рейс<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 10px; font-weight: 500; color: oklch(0.42 0.03 272)\">Одна задержка рушит весь маршрут. Нужны перебронирование, ясность по багажу и документы для страховой.<\u002Fp>\n          <div style=\"font-size: 13px; font-weight: 700; color: oklch(0.5 0.03 272)\">Риск: самый высокий уровень стресса<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px 24px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px\">Остались в салоне после посадки<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 10px; font-weight: 500; color: oklch(0.42 0.03 272)\">Самая уязвимая группа: выйти нельзя, информации нет, воды и питания может не быть.<\u002Fp>\n          <div style=\"font-size: 13px; font-weight: 700; color: oklch(0.5 0.03 272)\">Риск: долгое недоверие к перевозчику<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px 24px\">\n          <div style=\"font-size: 18px; font-weight: 800; margin-bottom: 8px\">Отменённый и чартерный рейс<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.6; margin: 0 0 10px; font-weight: 500; color: oklch(0.42 0.03 272)\">Отмена в последний момент, альтернативы только с переплатой, у чартеров непрозрачная зона ответственности между перевозчиком и туроператором.<\u002Fp>\n          <div style=\"font-size: 13px; font-weight: 700; color: oklch(0.5 0.03 272)\">Риск: прямые финансовые потери<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px\">6 · целевой путь<\u002Fdiv>\n      <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 900; font-size: 32px; line-height: 1.15; margin: 0 0 8px\">Сопровождение вместо самостоятельного квеста<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.65; margin: 0 0 18px; max-width: 68ch; font-weight: 500; color: oklch(0.44 0.04 272)\">Каждое предложение привязано к этапу as-is и барьеру, который оно снимает, с описанием результата и эффекта для человека. Ключевое:<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px\">\n        <div style=\"display: flex; gap: 14px; align-items: start; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.11); border-radius: 20px; padding: 18px 20px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.62 0.2 258); color: white; font-size: 13px; font-weight: 800; display: grid; place-items: center\">1<\u002Fspan><p style=\"font-size: 16px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.36 0.04 272)\"><strong style=\"font-weight: 800\">Проактивное уведомление о нарушении рейса<\u002Fstrong> — с причиной, ожидаемой длительностью и следующим шагом, вместо самостоятельного поиска информации у табло.<\u002Fp><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; align-items: start; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.11); border-radius: 20px; padding: 18px 20px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.62 0.2 258); color: white; font-size: 13px; font-weight: 800; display: grid; place-items: center\">2<\u002Fspan><p style=\"font-size: 16px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.36 0.04 272)\"><strong style=\"font-weight: 800\">Автоматическая электронная справка о задержке<\u002Fstrong> — снимает разом барьер перед работодателем, вузом и страховой. Без неё этапы 7 и 8 не проходятся.<\u002Fp><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; align-items: start; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.11); border-radius: 20px; padding: 18px 20px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.62 0.2 258); color: white; font-size: 13px; font-weight: 800; display: grid; place-items: center\">3<\u002Fspan><p style=\"font-size: 16px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.36 0.04 272)\"><strong style=\"font-weight: 800\">Единое окно претензии на компенсацию<\u002Fstrong> — данные рейса подтягиваются из билета, расходы прикладываются, статус отслеживается. Не нужно разбираться в структуре перевозчика.<\u002Fp><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; align-items: start; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.11); border-radius: 20px; padding: 18px 20px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.62 0.2 258); color: white; font-size: 13px; font-weight: 800; display: grid; place-items: center\">4<\u002Fspan><p style=\"font-size: 16px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.36 0.04 272)\"><strong style=\"font-weight: 800\">Инструкции и сервис альтернативных маршрутов<\u002Fstrong> — понятный алгоритм под вид транспорта и ситуацию, оценка последствий для стыковок, варианты продолжения пути.<\u002Fp><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; align-items: start; background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.11); border-radius: 20px; padding: 18px 20px\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.62 0.2 258); color: white; font-size: 13px; font-weight: 800; display: grid; place-items: center\">5<\u002Fspan><p style=\"font-size: 16px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.36 0.04 272)\"><strong style=\"font-weight: 800\">Ваучеры на питание и размещение плюс отслеживание статуса услуг<\u002Fstrong> — вместо очередей и подселения к незнакомым людям. И по запросу человека — информирование работодателя.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px\">\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px 24px\">\n          <h4 style=\"font-size: 18px; font-weight: 800; margin: 0 0 10px\">Результат<\u002Fh4>\n          <p style=\"font-size: 15px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.4 0.04 272)\">Отчёт, карта клиентского пути as-is / to-be и описание групп аудитории переданы заказчику как основание для проработки новой жизненной ситуации. Артефакты сделаны так, чтобы предложения читались не списком идей, а привязкой к этапу и барьеру — тогда их можно приоритизировать и разносить по ведомствам.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 24px; padding: 22px 24px\">\n          <h4 style=\"font-size: 18px; font-weight: 800; margin: 0 0 10px\">Ограничения и что бы изменила<\u002Fh4>\n          <p style=\"font-size: 15px; line-height: 1.65; margin: 0; font-weight: 500; color: oklch(0.4 0.04 272)\">Выборка качественная и небольшая, поэтому частоты барьеров я не заявляю — только их наличие и структуру. Люди вспоминали события прошлым числом, воспоминание сглаживает детали, часть таймингов я перепроверяла кабинетным исследованием. Кейс сильно усилил бы количественный замер на широкой выборке: какая доля пассажиров вообще доходит до компенсации.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"projects\" style=\"margin-bottom: 88px\">\n    <div style=\"display: inline-flex; padding: 8px 16px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); border-radius: 999px; font-family: Nunito, system-ui, sans-serif; font-size: 15px; font-weight: 800; margin-bottom: 18px\">Ещё проекты · кейсы в работе<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px\">\n      <article style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 26px 28px\">\n        <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px\">Госсектор · найм<\u002Fdiv>\n        <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1.2; margin: 0 0 10px\">Федеральный сервис найма на госслужбу<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.65; margin: 0 0 14px; font-weight: 500; color: oklch(0.4 0.03 272)\">Полный цикл: бриф, дизайн исследования, отчёт. 9 юзабилити-тестов и 8 интервью — от школьников и студентов до госслужащих. Часть сессий в паре с нейрофизиологом: айтрекинг, ЭЭГ, тепловые карты. Барьеры классифицированы по критичности, рекомендации переданы в бэклог.<\u002Fp>\n        <div style=\"font-size: 13px; font-weight: 800; color: oklch(0.55 0.03 272)\">17 сессий&nbsp;<\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 26px 28px\">\n        <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px\">B2B · мессенджер<\u002Fdiv>\n        <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1.2; margin: 0 0 10px\">Корпоративный суперапп в национальном мессенджере<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.65; margin: 0 0 14px; font-weight: 500; color: oklch(0.4 0.03 272)\">5 глубинных интервью с бизнес-пользователями трёх сегментов: продающий канал, корпоративная переписка, переписка с клиентами. Свела свои и командные находки в кросс-методный отчёт: системные барьеры → продуктовые выводы.<\u002Fp>\n        <div style=\"font-size: 13px; font-weight: 800; color: oklch(0.55 0.03 272)\">потенциальная аудитория ~100 млн<\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 26px 28px\">\n        <div style=\"display: inline-flex; padding: 6px 12px; background: oklch(0.955 0.015 272); border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px\">Госсектор · сквозные сценарии<\u002Fdiv>\n        <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1.2; margin: 0 0 10px\">Жизненная ситуация «Целевое обучение»<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 1.65; margin: 0 0 14px; font-weight: 500; color: oklch(0.4 0.03 272)\">Вторая ситуация, которую вела параллельно с кейсом 02: интервью с абитуриентами и студентами целевого обучения, CJM as-is / to-be для сценария длиной в годы — от выбора направления до отработки по договору.<\u002Fp>\n        <div style=\"font-size: 13px; font-weight: 800; color: oklch(0.55 0.03 272)\">CJM as-is / to-be · многолетний сценарий<\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <p style=\"font-size: 14px; line-height: 1.65; margin: 14px 0 0; font-weight: 600; color: oklch(0.5 0.03 272); max-width: 70ch\">Подробные кейсы готовлю к публикации, детали разберу на интервью.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"margin-bottom: 88px\">\n    <div style=\"display: inline-flex; padding: 8px 16px; background: oklch(0.26 0.04 272); color: oklch(0.97 0.02 95); border-radius: 999px; font-family: Nunito, system-ui, sans-serif; font-size: 15px; font-weight: 800; margin-bottom: 18px\">О себе<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px\">\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 26px 28px\">\n        <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1.2; margin: 0 0 12px\">Как я работаю<\u002Fh3>\n        <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 12px; font-weight: 500; color: oklch(0.38 0.03 272)\">{{ work1 }}<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 1.7; margin: 0; font-weight: 500; color: oklch(0.38 0.03 272)\">{{ work2 }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: oklch(0.99 0.008 95); border: 2px solid oklch(0.26 0.04 272 / 0.13); border-radius: 28px; padding: 26px 28px\">\n        <h3 style=\"font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1.2; margin: 0 0 12px\">Образование и практика<\u002Fh3>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.6; font-weight: 500; color: oklch(0.4 0.03 272)\">\n          <div><strong style=\"font-weight: 800; color: oklch(0.26 0.04 272)\">РГСУ<\u002Fstrong> — факультет психологии, бакалавриат, 4 курс (очно-заочно). До перевода — РАНХиГС совместно с МВШСЭН, факультет психологии.<\u002Fdiv>\n          <div><strong style=\"font-weight: 800; color: oklch(0.26 0.04 272)\">Яндекс Практикум · UX-исследования, 2026<\u002Fstrong> — лидировала исследовательскую команду, конкурентный анализ тревел-приложений для обоснования запуска фичи.<\u002Fdiv>\n          <div><strong style=\"font-weight: 800; color: oklch(0.26 0.04 272)\
